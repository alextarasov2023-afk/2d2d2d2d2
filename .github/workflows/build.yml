name: build

on:
  push:
    branches: [arena/01a0c51d-2d2d2d2d2]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build mod
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Publish build log
        if: always()
        run: |
          git config user.name "build-logger"
          git config user.email "build-logger@users.noreply.github.com"
          git checkout -B build-logs
          rm -f build-log.txt
          cp gradle-build.log build-log.txt 2>/dev/null || echo "no gradle log" > build-log.txt
          git add build-log.txt
          git commit -m "build log for run ${{ github.run_id }}" || true
          git push --force origin HEAD:build-logs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: List outputs
        if: success()
        run: ls -la build/libs

      - name: Stage artifact
        if: success()
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          rm -f dist/*-sources.jar dist/*-dev.jar
          ls -la dist/

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alexdlc-build
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release (best effort)
        if: success()
        continue-on-error: true
        run: |
          set -e
          JAR=$(ls dist/*.jar | head -n1)
          SHA=$(git rev-parse --short HEAD)
          gh release delete alexdlc-build --cleanup-tag || true
          gh release create alexdlc-build "$JAR" \
            --title "alexdlc build (${SHA})" \
            --notes "Automatic build of commit ${SHA}. Minecraft 26.2, Fabric." \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
