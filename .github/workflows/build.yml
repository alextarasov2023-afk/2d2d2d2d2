name: build

on:
  push:
    branches: [arena/01a0c51d-2d2d2d2d2]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build mod
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|FAILURE:|Execution failed|Caused by" gradle-build.log | head -40 | \
          while IFS= read -r line; do echo "::error title=Build::$line"; done
          echo "----- tail of gradle-build.log -----"
          tail -n 120 gradle-build.log

      - name: List outputs
        if: success()
        run: ls -la build/libs

      - name: Stage artifact
        if: success()
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          rm -f dist/*-sources.jar dist/*-dev.jar
          ls -la dist/

      - name: Verify jar
        if: success()
        run: |
          set -e
          JAR=$(ls dist/*.jar | head -n1)
          echo "verifying $JAR"
          jar tf "$JAR" | head -20
          jar tf "$JAR" | grep -q "fabric.mod.json"
          jar tf "$JAR" | grep -q "\.class"
          echo "jar OK: $(jar tf "$JAR" | grep -c '\.class') classes"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alexdlc-build
          path: dist/
          if-no-files-found: error
