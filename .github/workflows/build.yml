name: build

on:
  push:
    branches: [arena/01a0c51d-2d2d2d2d2]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build mod
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: List outputs
        if: success()
        run: ls -la build/libs

      - name: Stage artifact
        if: success()
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          rm -f dist/*-sources.jar dist/*-dev.jar
          ls -la dist/

      - name: Verify jar
        if: success()
        run: |
          set -e
          JAR=$(ls dist/*.jar | head -n1)
          echo "verifying $JAR"
          jar tf "$JAR" | head -20
          jar tf "$JAR" | grep -q "fabric.mod.json"
          jar tf "$JAR" | grep -q "\.class"
          echo "jar OK: $(jar tf "$JAR" | grep -c '\.class') classes"

      - name: Publish direct download links
        if: success()
        continue-on-error: true
        run: |
          JAR=$(ls dist/*.jar | head -n1)
          NAME="alexdlc-mc26.2-fabric.jar"
          cp "$JAR" "/tmp/$NAME"
          UA="alexdlc-ci-build/1.0"
          {
            echo "## Direct download"
            echo "(jar: $(basename "$JAR"), $(du -h "$JAR" | cut -f1))"
          } >> "$GITHUB_STEP_SUMMARY"
          verify() {
            local code
            curl -fsI --max-time 30 -A "$UA" "$1" -o /dev/null 2>/dev/null && return 0
            code=$(curl -s --max-time 30 --max-filesize 4096 -A "$UA" "$1" -o /dev/null -w "%{http_code}" 2>/dev/null || echo 0)
            [ "$code" = "200" ]
          }
          announce() {
            LABEL=$1; URL=$2
            echo "UPLOADED to $URL"
            echo "::notice title=Direct download ($LABEL)::$URL"
            echo "- $LABEL: $URL" >> "$GITHUB_STEP_SUMMARY"
          }
          OK=0

          # 1) catbox.moe — permanent
          RESP=$(curl -fsS --max-time 600 -A "$UA" -F "reqtype=fileupload" -F "fileToUpload=@/tmp/$NAME" https://catbox.moe/user/api.php 2>&1 || true)
          CURL=$(echo "$RESP" | grep -oE "https://files\.catbox\.moe/[A-Za-z0-9]+" | head -n1 || true)
          if [ -n "$CURL" ] && verify "$CURL"; then announce "catbox (permanent)" "$CURL"; OK=1; else echo "catbox failed: $RESP" | tail -c 300; fi

          # 2) 0x0.st — up to 1 year
          if [ "$OK" = "0" ]; then
            RESP=$(curl -fsS --max-time 600 -A "$UA" -F "file=@/tmp/$NAME" https://0x0.st 2>&1 || true)
            URL=$(echo "$RESP" | grep -oE "https://0x0\.st/[A-Za-z0-9]+" | head -n1 || true)
            if [ -n "$URL" ] && verify "$URL"; then announce "0x0.st (up to 1 year)" "$URL"; OK=1; else echo "0x0.st failed: $RESP" | tail -c 300; fi
          fi

          # 3) file.io — 14 days, single download
          if [ "$OK" = "0" ]; then
            RESP=$(curl -fsS --max-time 600 -A "$UA" -F "file=@/tmp/$NAME" "https://file.io/?expires=14" 2>&1 || true)
            URL=$(echo "$RESP" | grep -oE "https://file\.io/[A-Za-z0-9]+" | head -n1 || true)
            if [ -n "$URL" ] && verify "$URL"; then announce "file.io (14 days, single download)" "$URL"; OK=1; else echo "file.io failed: $RESP" | tail -c 300; fi
          fi

          # 4) temp.sh — 3 days
          if [ "$OK" = "0" ]; then
            RESP=$(curl -fsS --max-time 600 -A "$UA" -F "file=@/tmp/$NAME" https://temp.sh/upload 2>&1 || true)
            URL=$(echo "$RESP" | tr -d '\\' | grep -oE "https://temp\.sh/[A-Za-z0-9._-]+" | head -n1 || true)
            if [ -n "$URL" ] && verify "$URL"; then announce "temp.sh (3 days)" "$URL"; OK=1; else echo "temp.sh failed: $RESP" | tail -c 300; fi
          fi

          if [ "$OK" = "0" ]; then
            echo "all hosts failed; use the Actions artifact on this run page"
            echo "- no direct link available (all hosts refused upload) — download the **alexdlc-build** artifact from this run's Artifacts tab" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alexdlc-build
          path: dist/
          if-no-files-found: error
