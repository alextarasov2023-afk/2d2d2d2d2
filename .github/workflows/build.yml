name: build

on:
  push:
    branches: [arena/01a0c51d-2d2d2d2d2]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build mod
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: List outputs
        if: success()
        run: ls -la build/libs

      - name: Stage artifact
        if: success()
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          rm -f dist/*-sources.jar dist/*-dev.jar
          ls -la dist/

      - name: Verify jar
        if: success()
        run: |
          set -e
          JAR=$(ls dist/*.jar | head -n1)
          echo "verifying $JAR"
          jar tf "$JAR" | head -20
          jar tf "$JAR" | grep -q "fabric.mod.json"
          jar tf "$JAR" | grep -q "\.class"
          echo "jar OK: $(jar tf "$JAR" | grep -c '\.class') classes"

      - name: Publish direct download links
        if: success()
        continue-on-error: true
        run: |
          JAR=$(ls dist/*.jar | head -n1)
          NAME="alexdlc-mc26.2-fabric.jar"
          cp "$JAR" "/tmp/$NAME"
          echo "## Direct download" >> "$GITHUB_STEP_SUMMARY"
          OK=0
          # temp.sh: multipart upload, URL comes back in the response
          RESP=$(curl -fsS --max-time 300 -F "file=@/tmp/$NAME" https://temp.sh/upload 2>/dev/null || true)
          TURL=$(echo "$RESP" | grep -oE "https://temp\.sh/[A-Za-z0-9._-]+" | head -n1 || true)
          if [ -n "$TURL" ]; then
            echo "UPLOADED to $TURL"
            echo "::notice title=Direct download::$TURL"
            echo "- direct download: $TURL" >> "$GITHUB_STEP_SUMMARY"
            OK=1
          else
            echo "temp.sh upload failed: $RESP"
          fi
          if [ "$OK" = "0" ]; then
            URL=$(curl -fsS --max-time 300 -F "file=@/tmp/$NAME" https://0x0.st || true)
            if [ -n "$URL" ]; then
              echo "UPLOADED to $URL"
              echo "::notice title=Direct download::$URL"
              echo "- direct download: $URL" >> "$GITHUB_STEP_SUMMARY"
              OK=1
            else
              echo "all hosts failed; artifact remains as fallback"
            fi
          fi

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alexdlc-build
          path: dist/
          if-no-files-found: error
